name: Deploy to Azure

# Every push to main builds both images inside Azure Container Registry, tagged
# with the commit SHA, runs the database migrations as a one-off Container Apps
# job (the same job used for first-time setup), then rolls the four running
# apps to the new images. Needs one GitHub secret: AZURE_CREDENTIALS (a service
# principal with Contributor on rg-abs, in the azure/login JSON format).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  RG: rg-abs
  ACR: crabsrhwqzc
  BACKEND_URL: https://ca-abs-backend.calmpond-e17ccde3.westus3.azurecontainerapps.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Allow the containerapp CLI extension
        run: az config set extension.use_dynamic_install=yes_without_prompt extension.dynamic_install_allow_preview=true

      - name: Build backend image in ACR
        run: az acr build --registry $ACR --image syncabs-backend:${{ github.sha }} --file backend/Dockerfile ./backend

      - name: Build frontend image in ACR
        run: |
          az acr build --registry $ACR --image syncabs-frontend:${{ github.sha }} \
            --file frontend/Dockerfile.prod \
            --build-arg NEXT_PUBLIC_API_URL=$BACKEND_URL/api/v1 ./frontend

      - name: Run database migrations
        run: |
          IMAGE=$ACR.azurecr.io/syncabs-backend:${{ github.sha }}
          az containerapp job update -n job-abs-ops -g $RG --image $IMAGE --command alembic --args upgrade head
          EXEC=$(az containerapp job start -n job-abs-ops -g $RG --query name -o tsv)
          echo "migration execution: $EXEC"
          for i in $(seq 1 60); do
            STATUS=$(az containerapp job execution list -n job-abs-ops -g $RG --query "[?name=='$EXEC'].properties.status | [0]" -o tsv)
            echo "status: $STATUS"
            if [ "$STATUS" = "Succeeded" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Stopped" ]; then echo "migration failed"; exit 1; fi
            sleep 10
          done
          echo "migration timed out"; exit 1

      - name: Roll the backend, worker and scheduler to the new image
        run: |
          IMAGE=$ACR.azurecr.io/syncabs-backend:${{ github.sha }}
          for APP in ca-abs-backend ca-abs-worker ca-abs-beat; do
            az containerapp update -n $APP -g $RG --image $IMAGE
          done

      - name: Roll the frontend to the new image
        run: az containerapp update -n ca-abs-frontend -g $RG --image $ACR.azurecr.io/syncabs-frontend:${{ github.sha }}
